name: Build influxdb2

# Follows the latest stable InfluxDB 2.x release and builds it with the Dockerfile
# behind the official docker.io/library/influxdb image. See bitnami/influxdb2/README.md.

on:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths:
      - 'bitnami/influxdb2/**'
      - '.github/workflows/influxdb2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bitnami/influxdb2/**'
      - '.github/workflows/influxdb2.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'InfluxDB version to build, e.g. 2.10.0 (default: latest stable 2.x)'
        required: false
        default: ''
      force:
        description: 'Rebuild even if the image tag already exists'
        type: boolean
        default: false

concurrency:
  group: influxdb2-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/influxdb

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build context
        id: prep
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set +e
          out="$(bitnami/influxdb2/prepare.sh "$RUNNER_TEMP/context" "$VERSION_INPUT")"
          rc=$?
          set -e
          if [[ $rc -eq 3 ]]; then
            echo "::notice::Binaries for the requested release are not published yet, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ $rc -eq 0 ]] || exit $rc
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' && steps.prep.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: check
        if: steps.prep.outputs.skip != 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.prep.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$FORCE" != "true" ]] &&
             docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::notice::$IMAGE already exists, nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build for smoke test
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/context
          platforms: linux/amd64
          load: true
          tags: influxdb2-smoke:${{ steps.prep.outputs.version }}
          cache-from: type=gha,scope=influxdb2
          cache-to: type=gha,scope=influxdb2,mode=max

      - name: Smoke test
        if: steps.check.outputs.build == 'true'
        run: bitnami/influxdb2/smoke-test.sh "influxdb2-smoke:${{ steps.prep.outputs.version }}" "${{ steps.prep.outputs.version }}"

      - name: Extract metadata
        id: meta
        if: steps.check.outputs.build == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          # The moving tags only follow the latest stable release, so a manual
          # rebuild of an older version never rolls them back.
          tags: |
            type=raw,value=${{ steps.prep.outputs.version }}
            type=raw,value=${{ steps.prep.outputs.minor }},enable=${{ steps.prep.outputs.latest }}
            type=raw,value=2,enable=${{ steps.prep.outputs.latest }}
          labels: |
            org.opencontainers.image.title=influxdb
            org.opencontainers.image.description=InfluxDB ${{ steps.prep.outputs.version }}, built from influxdata-docker influxdb/${{ steps.prep.outputs.based_on }} @ ${{ steps.prep.outputs.upstream }}
            org.opencontainers.image.version=${{ steps.prep.outputs.version }}

      - name: Build and push
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/context
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=influxdb2
          cache-to: type=gha,scope=influxdb2,mode=max

      - name: Summary
        if: steps.check.outputs.build == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            echo "### InfluxDB ${{ steps.prep.outputs.version }}"
            echo "Dockerfile: influxdata-docker \`influxdb/${{ steps.prep.outputs.based_on }}\` @ \`${{ steps.prep.outputs.upstream }}\`"
            echo "Pushed: $PUSHED"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
